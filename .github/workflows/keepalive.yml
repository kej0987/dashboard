# Render 무료 플랜 15분 슬립 방지용 핑
#
# GitHub Actions 러너는 공유 IP라 Cloudflare(Render 앞단)가 간헐적으로 429로
# 레이트리밋한다(앱 자체 문제 아님 — /health 라우트는 정상, 다른 IP에서는 바로 200).
# 간격을 둔 재시도로 레이트리밋 윈도우를 벗어나고, 안 되면 워크플로를 실패 처리하지 않는다
# (10분 간격 핑이므로 한 번 놓쳐도 치명적이지 않다 — 매번 실패해서 메일이 오는 게 노이즈).
#
# 주의: GitHub Actions 의 짧은 간격(*/10) 스케줄은 부하 시 몇 시간씩 지연/스킵될 수 있음
# (GitHub 공식 동작 — 실제로 2026-10 운영 중 그렇게 확인됨). 이것만으로는 슬립을 완전히
# 막지 못하므로 cron-job.org 등 외부 스케줄러를 반드시 병행할 것.
name: keepalive
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping /health (간격을 둔 재시도, 실패해도 워크플로는 success 처리)
        run: |
          set +e  # curl 타임아웃(exit 28)에 재시도 루프가 중간에 죽지 않도록
          url="https://dashboard-c2ac.onrender.com/health"
          ua="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36"
          for i in 1 2 3 4 5; do
            code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 60 -A "$ua" "$url")
            if [ "$code" = "200" ]; then
              echo "OK ($code) on attempt $i"
              exit 0
            fi
            echo "attempt $i failed (HTTP $code)"
            [ "$i" -lt 5 ] && sleep 20
          done
          echo "::warning::keepalive ping failed after 5 attempts (last HTTP $code) — Cloudflare 레이트리밋 또는 Render 콜드스타트 지연 가능성"
